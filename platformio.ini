; ============================================================================
; PlatformIO — J.A.R.V.I.S. ESP-WROOM-32 (hibrido: ESP32 + Netlify)
; ============================================================================
; Tambem abre na Arduino IDE (jarvis_esp32.ino). Bibliotecas: ArduinoJson 6 e
; arduino-libhelix (decoder MP3 da voz do Jarvis).

[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 240000000L
; 1,9 MB de app com OTA (sobra espaco: o firmware tem ~1,1 MB)
board_build.partitions = min_spiffs.csv
build_flags = -DCORE_DEBUG_LEVEL=0

; Depois do 1o upload por cabo, atualize pelo WiFi:
;   upload_protocol = espota
;   upload_port = jarvis.local
;   upload_flags = --auth=jarvis-ota
lib_deps =
  bblanchon/ArduinoJson @ ^6.21.5
  https://github.com/pschatzmann/arduino-libhelix.git
