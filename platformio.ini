; ============================================================================
; PlatformIO Project Configuration File — J.A.R.V.I.S. ESP-WROOM-32
; ============================================================================
; Compativel tanto com PlatformIO (VS Code / Antigravity) quanto com Arduino IDE
; (basta abrir jarvis_esp32.ino diretamente na Arduino IDE).

[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 240000000L
board_build.partitions = huge_app.csv

lib_deps =
  bblanchon/ArduinoJson @ ^6.21.5
