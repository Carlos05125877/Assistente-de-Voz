# Deploy no Fly.io (regiao Sao Paulo). Troque o nome do app antes do primeiro deploy.
app = "jarvis-carlos"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATA_DIR = "/data"
  # PUBLIC_URL = "https://jarvis-carlos.fly.dev"   (definido no deploy; usado no callback do Spotify)

[http_service]
  internal_port = 8080
  force_https = true
  # O Jarvis precisa ficar sempre ligado (alarmes, lembretes e o long-poll do ESP32)
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 50
    hard_limit = 80

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/healthz"

[mounts]
  source = "jarvis_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
